<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CBPZHD5ZSP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CBPZHD5ZSP');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>Lucas Malinski</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAFAF9;
      --ink: #111827;
      --muted: #6B7280;
      --hair: #E5E7EB;
      --accent: #065F46;
      --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    [data-theme="dark"] {
      --bg: #0C0F0E;
      --ink: #F3F4F6;
      --muted: #9CA3AF;
      --hair: #232B27;
      --accent: #34D399;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 28px 28px 40px;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
    }

    .ctrl {
      background: none;
      border: none;
      padding: 0;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .ctrl:hover { color: var(--ink); }

    main {
      align-self: center;
      justify-self: center;
      width: 100%;
      max-width: 520px;
      padding-bottom: 6vh;
    }

    h1 {
      font-size: clamp(28px, 4.5vw, 36px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin: 0 0 24px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      padding-top: 22px;
      border-top: 1px solid var(--hair);
      font-family: var(--mono);
      font-size: 13px;
    }

    .links a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .links a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="controls">
    <button class="ctrl" id="lang-btn" type="button">PT-BR</button>
    <button class="ctrl" id="theme-btn" type="button">Dark</button>
  </div>

  <main>
    <h1>Lucas Malinski</h1>
    <nav class="links" aria-label="Links">
      <a id="cv-link" href="/cv/">resume</a>
      <a href="https://github.com/lucasmalinski" target="_blank" rel="noopener">github</a>
      <a href="https://www.linkedin.com/in/lucasmalinski" target="_blank" rel="noopener">linkedin</a>
      <a href="mailto:contato@lucasmalinski.dev">contato@lucasmalinski.dev</a>
    </nav>
  </main>

  <script>
    const COPY = {
      en: { cvText: "resume", cvHref: "/cv/", langBtn: "PT-BR" },
      pt: { cvText: "currículo", cvHref: "/cv/pt-br.html", langBtn: "EN" },
    };

    const root = document.documentElement;
    const themeBtn = document.getElementById("theme-btn");
    const langBtn = document.getElementById("lang-btn");
    const cvLink = document.getElementById("cv-link");

    function applyTheme(t) {
      root.setAttribute("data-theme", t);
      localStorage.setItem("lm_theme", t);
      themeBtn.textContent = t === "dark" ? "Light" : "Dark";
    }

    function applyLang(l) {
      const d = COPY[l] || COPY.en;
      root.lang = l === "pt" ? "pt-BR" : "en";
      localStorage.setItem("lm_lang", l);
      cvLink.textContent = d.cvText;
      cvLink.href = d.cvHref;
      langBtn.textContent = d.langBtn;
    }

    applyTheme(localStorage.getItem("lm_theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    const urlLang = new URLSearchParams(window.location.search).get("lang");
    applyLang(urlLang === "pt" || urlLang === "en" ? urlLang : (localStorage.getItem("lm_lang") || "en"));

    themeBtn.addEventListener("click", () => applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"));
    langBtn.addEventListener("click", () => applyLang(root.lang === "pt-BR" ? "en" : "pt"));
  </script>
</body>
</html>
